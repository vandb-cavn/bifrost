# Bifrost OSS deploy smoke test: Postgres + Redis + HTTP gateway (multi-node cluster hooks).
#
# Image build uses transports/Dockerfile (repo root as context — no symlink; portable with Buildx).
#
# From repository root:
#   docker compose -f deploy/test/docker-compose.yml build
#   docker compose -f deploy/test/docker-compose.yml up
#
# UI: http://localhost:8080  |  Health: GET http://localhost:8080/health
#
# Second instance (different stream consumer id):
#   docker compose -f deploy/test/docker-compose.yml --profile two-nodes up
#
# Set a real provider key in config or via UI after first boot; empty "providers" is valid for health-only.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bifrost
      POSTGRES_PASSWORD: bifrost_password
      POSTGRES_DB: bifrost
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bifrost -d bifrost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bifrost_test

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - bifrost_test

  bifrost:
    image: bifrost:test
    build:
      context: ../..
      dockerfile: transports/Dockerfile
      args:
        VERSION: test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      APP_HOST: "0.0.0.0"
      LOG_LEVEL: info
      LOG_STYLE: json
      APP_DIR: /app/data
      BIFROST_NODE_ID: bifrost-docker-1
    volumes:
      - bifrost_data_1:/app/data
      - ./config/config.docker.json:/app/data/config.json:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/health",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5
    restart: unless-stopped
    networks:
      - bifrost_test

  bifrost-2:
    profiles: [two-nodes]
    image: bifrost:test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      APP_PORT: "8080"
      APP_HOST: "0.0.0.0"
      LOG_LEVEL: info
      LOG_STYLE: json
      APP_DIR: /app/data
      BIFROST_NODE_ID: bifrost-docker-2
    volumes:
      - bifrost_data_2:/app/data
      - ./config/config.docker.json:/app/data/config.json:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/health",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5
    restart: unless-stopped
    networks:
      - bifrost_test

volumes:
  postgres_data:
  bifrost_data_1:
  bifrost_data_2:

networks:
  bifrost_test:
    driver: bridge
